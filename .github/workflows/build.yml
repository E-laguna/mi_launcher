name: Compilar APK Android

on:
  push:
    branches:
      - main
      - Principal
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Generar APK desde PWA
        uses: pwa-builder/pwa-action@v1.0.1
        with:
          pwa-url: 'https://raw.githack.com/E-laguna/mi_launcher/main/index.html'
          output-type: 'apk'

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MiLauncher-APK
          path: '*.apk'
