function turnosDeRango(desde){
  return DB.trabajoTurnos.filter(t=>t.fecha>=desde);
}
function inicioSemana(){ const d=new Date(); const off=(d.getDay()+6)%7; return addDays(todayStr(), -off); }
function inicioMes(){ return todayStr().slice(0,8)+'01'; }
function renderTrabResumen(tabsHtml){
  const hoy = turnosDeRango(todayStr());
  const semana = turnosDeRango(inicioSemana());
  const mes = turnosDeRango(inicioMes());
  const sum = (arr,k)=> arr.reduce((s,t)=>s+(Number(t[k])||0),0);
  const ingresosHoy = sum(hoy,'ingresos');
  const ingresosSemana = sum(semana,'ingresos'), ingresosMes = sum(mes,'ingresos');
  const horasMes = sum(mes,'horas'), gasolinaMes = sum(mes,'gasolina'), kmMes = sum(mes,'km');
  const porHora = horasMes ? (ingresosMes/horasMes).toFixed(1) : '0';
  const metaDia = Number(DB.trabajoMeta.diaria)||0, metaSem = Number(DB.trabajoMeta.semanal)||0, metaMes = Number(DB.trabajoMeta.mensual)||0;
  view().innerHTML = `
    ${tabsHtml}
    <div class="stats-grid" style="grid-template-columns:1fr 1fr;">
      <div class="stat-box"><div class="num">$${ingresosHoy.toFixed(0)}</div><div class="lbl">INGRESOS HOY</div></div>
      <div class="stat-box"><div class="num">$${ingresosSemana.toFixed(0)}</div><div class="lbl">INGRESOS SEMANA</div></div>
    </div>
    ${metaDia?`<div class="hint">Meta diaria: $${metaDia} · ${Math.min(100,Math.round(ingresosHoy/metaDia*100))}% cumplido</div>`:''}
    ${metaSem?`<div class="hint">Meta semanal: $${metaSem} · ${Math.min(100,Math.round(ingresosSemana/metaSem*100))}% cumplido</div>`:''}
    ${metaMes?`<div class="hint">Meta mensual: $${metaMes} · ${Math.min(100,Math.round(ingresosMes/metaMes*100))}% cumplido</div>`:''}
    <div class="stats-grid">
      <div class="stat-box"><div class="num">$${ingresosMes.toFixed(0)}</div><div class="lbl">INGRESOS MES</div></div>
      <div class="stat-box"><div class="num">$${porHora}</div><div class="lbl">POR HORA</div></div>
      <div class="stat-box"><div class="num">$${gasolinaMes.toFixed(0)}</div><div class="lbl">GASOLINA MES</div></div>
    </div>
    <div class="divider"></div>
    <div class="section-sub">Mantenimiento pendiente hoy</div>
    <div class="list">
      ${mantChecklistPendientesHoy().slice(0,4).map(m=>`<div class="card row-between"><span>${escapeHtml(m.texto)}</span><span class="pill">${m.freqLabel}</span></div>`).join('') || '<div class="hint">Todo al día 👍</div>'}
    </div>
  `;
}

const MANT_FIELDS = [
  {key:'item', label:'Elemento a revisar', type:'text', ph:'Ej. Cambio de aceite'},

const MANT_FREQS = [{k:'diario',l:'Revisar cada día',ic:'☀️'},{k:'semanal',l:'Cada semana (lavado, limpieza)',ic:'🗓️'},{k:'mensual',l:'Cada mes',ic:'🔧'}];
function mantVenceInicio(freq){
  if(freq==='diario') return todayStr();
  if(freq==='semanal') return inicioSemana();
  return inicioMes();
}
function mantItemHecho(item, freq){ return item.lastDone && item.lastDone >= mantVenceInicio(freq); }
function mantChecklistPendientesHoy(){
  const out = [];
  MANT_FREQS.forEach(f=>{
    (DB.trabajoMantChecklist[f.k]||[]).forEach(item=>{
      if(!mantItemHecho(item, f.k)) out.push({texto:item.texto, freqLabel:f.k});
    });
  });
  return out;
}
function renderTrabMant(tabsHtml){
  const checklistHtml = MANT_FREQS.map(f=>{
    const items = DB.trabajoMantChecklist[f.k]||[];
    const rows = items.map(it=>`
      <div class="checkline">
        <input type="checkbox" ${mantItemHecho(it,f.k)?'checked':''} onchange="toggleMantChecklist('${f.k}','${it.id}')">
        <div class="txt ${mantItemHecho(it,f.k)?'done':''}">${escapeHtml(it.texto)}</div>
        <div class="icon-btn danger" onclick="deleteMantChecklistItem('${f.k}','${it.id}')">✕</div>

  }).join('');

    <div class="checkline">

function proximaOcurrencia(mmdd){
  // mmdd: 'MM-DD' -> siguiente fecha en el futuro (o hoy)
  const t = new Date();
  const [mm,dd] = mmdd.split('-').map(Number);
  let year = t.getFullYear();
  let d = new Date(year, mm-1, dd);
  if(fmtDate(d) < todayStr()) d = new Date(year+1, mm-1, dd);
  return fmtDate(d);
}
function diasHasta(dateStr){
  return Math.round((new Date(dateStr+'T00:00:00') - new Date(todayStr()+'T00:00:00'))/86400000);
}
function renderRelProximos(tabsHtml){
  const items = [];
  DB.relPersonas.forEach(p=>{
    if(p.cumple){
      const mmdd = p.cumple.slice(5);
      const nd = proximaOcurrencia(mmdd);
      items.push({titulo:`Cumpleaños de ${p.nombre}`, sub:p.relacion||'', fecha:nd, ic:'🎂'});
    }
  });
  const FECHA_ICONS = {cumpleanos:'🎂',cita:'📅',aniversario:'💞',evento:'🎉',recordatorio:'📌',viaje:'✈️',pago:'💳',otro:'📌'};

  DB.relDescansos.forEach(d=>{

  });
  items.sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const rows = items.filter(i=>i.fecha>=addDays(todayStr(),-1)).map(i=>{
    const dd = diasHasta(i.fecha);
    return `<div class="upcoming-item">
      <div class="badge-days"><div class="n">${dd<=0?'Hoy':dd}</div>${dd>0?'<div class="u">DÍAS</div>':''}</div>
      <div class="info"><div class="t">${i.ic} ${escapeHtml(i.titulo)}</div><div class="s">${escapeHtml(i.sub||'')} · ${humanDate(i.fecha)}</div></div>
    </div>`;
  }).join('') || `<div class="empty-state"><span class="ic">❤️</span>Agrega personas o fechas importantes para verlas aquí.</div>`;
  view().innerHTML = `${tabsHtml}<div class="list">${rows}</div>`;

/* ================= APPS (launcher personal) ================= */
// Nota honesta: esta pantalla puede abrir apps que tengan un esquema de enlace
// propio (whatsapp://, spotify:, etc.) desde dentro del wrapper. Convertir esta
// app en el launcher real de Android (lo que se ve al prender el teléfono) es
// una configuración del empaquetado (AndroidManifest), no algo que se pueda
// activar solo con HTML/JS — depende de si el servicio con el que la
// empaquetaste soporta declararla como launcher.
function hhmmToMin(hhmm){ const [h,m] = (hhmm||'00:00').split(':').map(Number); return h*60+(m||0); }
function fmtHora(hhmm){
  const [h,m] = (hhmm||'00:00').split(':').map(Number);
  const ampm = h<12 ? 'am' : 'pm';
  const h12 = ((h%12)===0) ? 12 : h%12;
  return `${h12}:${String(m||0).padStart(2,'0')} ${ampm}`;
}
function appsLockCfg(){ return DB.appsLock || {inicio:'08:00', fin:'22:00'}; }
function appsLockWindow(){
  const cfg = appsLockCfg();
  const nowMin = new Date().getHours()*60 + new Date().getMinutes();
  const ini = hhmmToMin(cfg.inicio), fin = hhmmToMin(cfg.fin);
  if(ini === fin) return false; // horario en 0 = sin bloqueo
  if(ini < fin) return nowMin>=ini && nowMin<fin;       // mismo día, ej. 08:00–22:00
  return nowMin>=ini || nowMin<fin;                      // cruza medianoche, ej. 22:00–08:00
}
RENDERERS.apps = function(){
  setTop('Apps', false);
  const locked = appsLockWindow();
  const cfg = appsLockCfg();
  const apps = DB.apps||[];
  const horaTxt = new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
  view().innerHTML = `
    <div class="hint" style="margin:2px 0 12px;">
      ${locked
        ? `Son las ${horaTxt}. De ${fmtHora(cfg.inicio)} a ${fmtHora(cfg.fin)} no puedes agregar, quitar apps ni cambiar este horario — solo abrir lo que ya tienes. Se desbloquea a las ${fmtHora(cfg.fin)}.`
        : `Son las ${horaTxt}. Puedes agregar, quitar apps o cambiar el horario ahora — se vuelve a bloquear a las ${fmtHora(cfg.inicio)}.`}
    </div>
    <div class="card" style="cursor:${locked?'default':'pointer'};" ${locked?'':`onclick="openLockConfigModal()"`}>
      <div class="row" style="justify-content:space-between;">
        <div><b>⏰ Horario bloqueado</b><div class="hint" style="margin-top:2px;">${fmtHora(cfg.inicio)} – ${fmtHora(cfg.fin)}</div></div>
        <div class="hint" style="margin:0;">${locked?'🔒':'Editar ›'}</div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="ex-grid" id="apps-grid">
      ${apps.length ? apps.map(a=>`
        <div class="app-card">
          <button class="app-open" onclick="abrirApp('${a.id}')">
            <div class="app-emoji">${escapeHtml(a.emoji||'📱')}</div>
            <div class="app-name">${escapeHtml(a.nombre)}</div>
          </button>
          ${locked?'':`<button class="app-del" onclick="quitarApp('${a.id}')">✕</button>`}
        </div>
      `).join('') : `<div class="empty-state" style="grid-column:1/-1;"><span class="ic">📱</span>${locked?'Aún no agregas apps. Espera a que se desbloquee para agregar las primeras.':'Toca el botón + para agregar tu primera app.'}</div>`}
    </div>
  `;
  setFab(!locked, ()=>openAppModal(), '+');
};
function abrirApp(id){
  const a = (DB.apps||[]).find(x=>x.id===id);
  if(!a) return;
  if(!a.url){ alert('Esta app no tiene un enlace configurado todavía.'); return; }
  window.location.href = a.url;
}
function openAppModal(){
  if(appsLockWindow()){ alert(`No puedes agregar apps entre ${fmtHora(appsLockCfg().inicio)} y ${fmtHora(appsLockCfg().fin)}.`); return; }
  openModal('Agregar app', `
    <label class="field-label">Nombre</label>
    <input type="text" id="app-nombre" placeholder="Ej. WhatsApp">
    <label class="field-label">Emoji / ícono</label>
    <input type="text" id="app-emoji" placeholder="📱" maxlength="4">
    <label class="field-label">Enlace para abrirla</label>
    <div class="hint" style="margin:-2px 0 6px;">El esquema propio de la app si lo tiene (ej. whatsapp://, spotify:, instagram://) o una página web. No todas las apps tienen uno — pruébalo después de guardar.</div>
    <input type="text" id="app-url" placeholder="Ej. whatsapp://">
    <div class="modal-actions">
      <button class="btn btn-ghost btn-block" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary btn-block" id="save-app-btn">Guardar</button>
    </div>
  `, {afterRender(){
    document.getElementById('save-app-btn').onclick = async ()=>{
      if(appsLockWindow()){ alert('Se acaba de activar el bloqueo. Espera a que termine.'); closeModal(); render(); return; }
      const nombre = document.getElementById('app-nombre').value.trim();
      if(!nombre){ alert('Ponle un nombre a la app'); return; }
      const emoji = document.getElementById('app-emoji').value.trim() || '📱';
      const url = document.getElementById('app-url').value.trim();
      DB.apps = DB.apps || [];
      DB.apps.push({id:uid(), nombre, emoji, url});
      await persist('apps');
      closeModal();
      render();
    };
  }});
}
async function quitarApp(id){
  if(appsLockWindow()){ alert(`No puedes quitar apps entre ${fmtHora(appsLockCfg().inicio)} y ${fmtHora(appsLockCfg().fin)}.`); return; }
  if(!confirm('¿Quitar esta app de tu lista?')) return;
  DB.apps = (DB.apps||[]).filter(a=>a.id!==id);
  await persist('apps');
  render();
}
function openLockConfigModal(){
  if(appsLockWindow()){ alert('El horario ya está activo — no se puede cambiar hasta que termine. Así funciona a propósito, para que no te lo saltes a medio bloqueo.'); return; }
  const cfg = appsLockCfg();
  openModal('Horario de bloqueo', `
    <div class="hint" style="margin:-2px 0 10px;">Mientras este horario esté corriendo, no vas a poder agregar apps, quitarlas, ni volver a cambiar estas horas — ni siquiera para adelantarlo. Solo se edita fuera del horario.</div>
    <label class="field-label">Empieza el bloqueo</label>
    <input type="time" id="lock-inicio" value="${cfg.inicio}">
    <label class="field-label">Termina el bloqueo</label>
    <input type="time" id="lock-fin" value="${cfg.fin}">
    <div class="modal-actions">
      <button class="btn btn-ghost btn-block" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary btn-block" id="save-lock-btn">Guardar</button>
    </div>
  `, {afterRender(){
    document.getElementById('save-lock-btn').onclick = async ()=>{
      const inicio = document.getElementById('lock-inicio').value || '08:00';
      const fin = document.getElementById('lock-fin').value || '22:00';
      DB.appsLock = {inicio, fin};
      await persist('appsLock');
      closeModal();
      render();
    };
  }});
}


/* ================= BOOT ================= */
document.getElementById('modal-overlay').addEventListener('click', (e)=>{
  if(e.target.id==='modal-overlay') closeModal();
});
(async function init(){
  await loadAll();
  const initial = {section:'personal', sub:'habitos', extra:null};
  history.replaceState(initial, '');
  state = initial;
  render();
})();
</script>
